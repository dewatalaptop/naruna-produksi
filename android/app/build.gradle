apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"

android {
    namespace "com.aiappbuilder.narunaproduksi"
    compileSdk 36

    defaultConfig {
        applicationId "com.aiappbuilder.narunaproduksi"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.activity:activity-ktx:1.11.0"

    // CameraX + ML Kit — spec section 6 names both explicitly for the QR scan flow.
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    // ProcessCameraProvider.getInstance() returns a Guava ListenableFuture —
    // camera-core doesn't pull in a full Guava impl transitively, only its
    // API surface, so this needs to be explicit or compileDebugKotlin fails
    // with "Cannot access class 'ListenableFuture'".
    implementation "com.google.guava:guava:33.3.1-android"

    // Room — spec section 6's explicit offline-queue mechanism (scan_events
    // written locally first, synced once connectivity returns).
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // WorkManager — drives the offline-queue sync worker.
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Firebase — Auth (station login), Firestore (all app data), Messaging (FCM).
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-messaging-ktx"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"
}

// google-services.json is committed (a public client identifier, not a
// secret — same as retail-pos's). Applied last, as the plugin itself
// requires the other Android/Kotlin config above to already be evaluated.
apply plugin: "com.google.gms.google-services"
