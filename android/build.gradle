buildscript {
    ext.kotlin_version = "2.0.21"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.4"
    }
}

// Repositories for module dependency resolution are centralized in
// settings.gradle's dependencyResolutionManagement (FAIL_ON_PROJECT_REPOS)
// — an allprojects{repositories{...}} block here would conflict with that
// (confirmed via a real CI failure: "Build was configured to prefer
// settings repositories over project repositories but repository 'Google'
// was added by build file 'build.gradle'").

task clean(type: Delete) {
    delete rootProject.buildDir
}
