<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naruna Produksi — Masuk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
      .login-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
        padding: 40px 36px; max-width: 380px; width: 100%; text-align: center;
      }
      .login-card .brand { font-size: 22px; font-weight: 800; color: var(--clay); margin-bottom: 4px; }
      .login-card .sub { color: var(--text-secondary); font-size: 13.5px; margin-bottom: 28px; }
      .google-btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px;
        background: #fff; font-weight: 600; font-size: 14px; color: var(--text);
      }
      .google-btn:hover { background: var(--surface-sunk); }
      .login-error { color: var(--rust); font-size: 13px; margin-top: 14px; display: none; }
      .guide-btn {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        width: 100%; padding: 11px; border-radius: 10px; margin-top: 10px;
        background: var(--clay-soft); color: var(--clay-hover); font-weight: 700; font-size: 14px;
        text-decoration: none;
      }
      .guide-btn:hover { background: var(--clay); color: #fff; }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand">Naruna Produksi</div>
      <p class="sub">Sistem manajemen produksi Naruna Ceramic Studio</p>
      <button class="google-btn" id="google-signin">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
        Masuk dengan Google
      </button>
      <p class="login-error" id="login-error">Gagal masuk. Coba lagi.</p>
      <a href="/panduan.html" class="guide-btn">📖 Lihat Panduan Lengkap Penggunaan</a>
      <a href="/unduh-aplikasi.html" style="display:block; margin-top:14px; font-size:13px; color:var(--text-faint);">
        Operator stasiun? Unduh aplikasi Android →
      </a>
    </div>

    <script type="module">
      import { auth, googleProvider, signInWithPopup, onAuthStateChanged } from "/src/firebase.js";

      onAuthStateChanged(auth, (user) => {
        if (user) window.location.href = "/dashboard.html";
      });

      document.getElementById("google-signin").addEventListener("click", async () => {
        const errEl = document.getElementById("login-error");
        errEl.style.display = "none";
        try {
          await signInWithPopup(auth, googleProvider);
          window.location.href = "/dashboard.html";
        } catch (err) {
          console.error(err);
          errEl.textContent = err.message ?? "Gagal masuk. Coba lagi.";
          errEl.style.display = "block";
        }
      });
    </script>
  </body>
</html>
